<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fulfillment · My pay (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#FFFFFF;background-color:#07080D;background-image:radial-gradient(ellipse 90% 40% at 90% -5%, rgba(52,224,196,0.24) 0%, transparent 70%),radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);background-size:auto,22px 22px">

<div style="padding:18px 16px 110px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;align-items:baseline;gap:10px"><h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;letter-spacing:-.03em">My pay</h1><span style="font-size:14px;color:#8697B5">This week · Oct 12 – 18</span></div>

<section style="padding:18px;border-radius:24px;background:radial-gradient(ellipse 70% 110% at 100% 0%, rgba(52,224,196,0.30) 0%, transparent 65%), linear-gradient(135deg, #16294C 0%, #0D1730 60%, #0A1024 100%);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)">
<div style="font-size:13px;font-weight:600;color:#B4C3DE">You've earned this week</div>
<div style="margin-top:6px;display:flex;align-items:baseline;gap:2px"><span style="font-family:'Space Grotesk',sans-serif;font-size:46px;font-weight:700;letter-spacing:-.04em;line-height:1">$130</span><span style="font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:600;color:#9FB0CF">.00</span></div>
<div style="margin-top:6px;font-size:13.5px;color:#9FB0CF">13 cancels × $10</div>
<div style="margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px">
<span style="width:40px;height:40px;flex:none;border-radius:12px;background:{{bank.tint}};color:{{bank.c}};display:flex;align-items:center;justify-content:center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{bank.icon}}"/></svg></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:14.5px;font-weight:700">{{bank.t}}</span><span style="display:block;margin-top:1px;font-size:12.5px;color:#9FB0CF">{{bank.s}}</span></span>
</div>
<sc-if value="{{noBank}}" hint-placeholder-val="{{ false }}">
<a href="#" style="margin-top:14px;height:50px;border-radius:999px;background:#FFFFFF;color:#0D1730;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Connect a bank · 3 min</a>
</sc-if>
</section>

<div role="group" aria-label="Filter cancels" style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:5px;gap:4px;border-radius:20px;background:linear-gradient(180deg,#151A26 0%,#10131C 100%);border:1px solid rgba(255,255,255,.09)">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
<button type="button" aria-pressed="{{s.pressed}}" style="position:relative;height:70px;border:none;border-radius:15px;background:{{s.bg}};font-family:inherit;color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:{{s.ring}}"><span style="font-size:13px;font-weight:700;color:{{s.c}};white-space:nowrap">{{s.l}}</span><span style="font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;line-height:1;color:{{s.lfg}}">{{s.n}}</span><span style="position:absolute;bottom:7px;width:18px;height:3px;border-radius:2px;background:{{s.c}};opacity:{{s.bar}}"></span></button>
</sc-for>
</div>

<section>
<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><h2 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;letter-spacing:-.015em">Your cancels</h2><span style="flex:1"></span><span style="font-size:13px;color:#8697B5">$10 each</span></div>
<div style="border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#151A26 0%,#10131C 100%);border:1px solid rgba(255,255,255,.09)">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<a href="#" style="display:flex;align-items:center;gap:12px;height:68px;padding:0 14px;border-top:{{r.rule}};text-decoration:none;color:#FFFFFF;background:{{r.rowBg}}">
<span style="width:40px;height:40px;flex:none;border-radius:50%;background:rgba(127,166,242,.16);color:#A9C2F5;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center">{{r.ini}}</span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.client}}</span><span style="display:block;margin-top:2px;font-size:12.5px;color:#8697B5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.sub}}</span></span>
<span style="text-align:right;flex:none"><span style="display:block;font-size:13.5px;font-weight:700;color:{{r.c}}">{{r.status}}</span><span style="display:block;margin-top:2px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:{{r.payFg}}">{{r.pay}}</span></span>
</a>
</sc-for>
</div>
</section>

<section>
<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><h2 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;letter-spacing:-.015em">Payouts</h2><span style="flex:1"></span><span style="font-size:13px;color:#8697B5">$420 this month</span></div>
<div style="border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#151A26 0%,#10131C 100%);border:1px solid rgba(255,255,255,.09)">
<sc-for list="{{payouts}}" as="p" hint-placeholder-count="2">
<div style="display:flex;align-items:center;gap:12px;height:64px;padding:0 14px;border-top:{{p.rule}}">
<span style="width:42px;height:44px;flex:none;border-radius:12px;background:rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1"><small style="font-size:9.5px;font-weight:800;letter-spacing:.06em;color:#8697B5">{{p.mon}}</small><b style="margin-top:3px;font-family:'Space Grotesk',sans-serif;font-size:17px">{{p.day}}</b></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:14.5px;font-weight:700">{{p.week}}</span><span style="display:block;margin-top:2px;font-size:12.5px;color:#8697B5">{{p.sub}}</span></span>
<span style="text-align:right"><span style="display:block;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700">{{p.amt}}</span><span style="display:block;margin-top:2px;font-size:12px;font-weight:700;color:{{p.c}}">{{p.status}}</span></span>
</div>
</sc-for>
</div>
</section>
</div>

<nav aria-label="Main" style="position:absolute;left:0;right:0;bottom:0;height:86px;box-sizing:border-box;padding:8px 10px 22px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;background:rgba(10,13,22,.94);border-top:1px solid rgba(255,255,255,.09);box-shadow:0 -20px 40px -20px rgba(0,0,0,.9)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" aria-label="{{t.l}}" style="display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:{{t.fg}};font-size:11px;font-weight:{{t.w}}">
<span style="width:{{t.size}}px;height:{{t.size}}px;margin-top:{{t.mt}}px;border-radius:{{t.r}};display:flex;align-items:center;justify-content:center;background:{{t.bg}};color:{{t.ic}};box-shadow:{{t.glow}}"><svg width="{{t.isz}}" height="{{t.isz}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{t.sw}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg></span>
<span style="display:{{t.lshow}}">{{t.l}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"connected":{"editor":"boolean","default":true},"filter":{"editor":"enum","options":["None","Verified","Checking","Needs a listen"],"default":"None"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const TABS = [
['Today', 'FulToday.dc.html', 'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z'],
['Clients', 'FulClients.dc.html', 'M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M21 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8'],
['Call', 'FulCall.dc.html', 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2'],
['Pay', 'FulPay.dc.html', 'M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4zM4 7a2 2 0 0 1 2-2h11M16 14h2'],
['More', 'FulMore.dc.html', 'M4 6h16M4 12h16M4 18h10'],
];
const active = 'Pay';
const tabs = TABS.map(([l, href, icon]) => {
const big = l === 'Call', on = l === active;
return big
? { l, href, icon, size: 56, mt: -26, r: '50%', bg: 'linear-gradient(135deg,#34E0C4 0%,#4B79CE 100%)', ic: '#FFFFFF', glow: '0 12px 28px -8px rgba(52,224,196,.8), 0 0 0 5px #0A0D16', isz: 24, sw: 2.3, lshow: 'none', fg: '#FFFFFF', w: 700 }
: { l, href, icon, size: 30, mt: 0, r: '10px', bg: 'transparent', ic: on ? '#7FA6F2' : '#8697B5', glow: 'none', isz: 22, sw: on ? 2.2 : 1.9, lshow: 'block', fg: on ? '#FFFFFF' : '#8697B5', w: on ? 700 : 600 };
});
const connected = this.props.connected ?? true;
const bank = connected
? { t: 'Paid Mon, Oct 19', s: 'Automatically · to Chase •••• 4821', icon: 'M4 10h16M6 10v8M10 10v8M14 10v8M18 10v8M3 20h18M12 3l9 5H3z', c: '#5EEAD4', tint: 'rgba(52,224,196,0.15)' }
: { t: 'Add a bank to get paid', s: 'Your verified cancels wait here until you do', icon: 'M12 9v4M12 17h.01M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z', c: '#FCD34D', tint: 'rgba(251,191,36,0.15)' };
const picked = this.props.filter ?? 'None';
const stats = [['Verified', '12', '#5EEAD4'], ['Checking', '1', '#A9C2F5'], ['Needs a listen', '1', '#FCD34D']].map(([l, n, c]) => { const on = l === picked; return { l, n, c, pressed: on ? 'true' : 'false', bg: on ? 'rgba(255,255,255,0.09)' : 'transparent', ring: on ? 'inset 0 0 0 1px rgba(255,255,255,0.14)' : 'none', lfg: on ? '#FFFFFF' : '#C9D4E8', bar: on ? 1 : 0 }; });
const ST = { v: ['Verified', '#5EEAD4'], c: ['Checking', '#A9C2F5'], l: ['Needs a listen', '#FCD34D'] };
const RL = '1px solid rgba(255,255,255,0.07)';
const all = [
['Maria Lopez', 'State Farm · Today 1:40 PM', 'c'],
['Derek Hall', 'Allstate · Today 11:15 AM', 'v'],
['Tom Becker', 'GEICO · Tue 4:20 PM', 'l'],
['Lena Park', 'State Farm · Tue 3:05 PM', 'v'],
];
const rows = all.filter(r => picked === 'None' || ST[r[2]][0] === picked).map(([client, sub, s], i) => ({ client, sub, ini: client.split(' ').map(x => x[0]).join(''), status: ST[s][0], c: ST[s][1], pay: s === 'l' ? 'On hold' : '$10.00', payFg: s === 'v' ? '#FFFFFF' : '#6F84A8', rowBg: s === 'l' ? 'rgba(251,191,36,.05)' : 'transparent', rule: i ? RL : 'none' }));
const to = connected ? 'to Chase •••• 4821' : 'waiting for a bank';
const payouts = [
{ mon: 'OCT', day: '12', week: 'Oct 5 – 11', sub: '23 cancels · ' + to, amt: '$230.00', status: connected ? 'Paid' : 'Held', c: connected ? '#4ADE80' : '#FCD34D', rule: 'none' },
{ mon: 'OCT', day: '5', week: 'Sep 28 – Oct 4', sub: '19 cancels · ' + to, amt: '$190.00', status: connected ? 'Paid' : 'Held', c: connected ? '#4ADE80' : '#FCD34D', rule: RL },
];
return { tabs, bank, noBank: !connected, stats, rows, payouts };
}
}
</script>
</body>
</html>
