<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fulfillment · How did it go (phone sheet)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#FFFFFF;background:#07080D">
<dc-import name="FulToday" hint-size="390px,844px"></dc-import>
<div style="position:absolute;inset:0;background:rgba(3,5,10,.66)"></div>

<section aria-label="How did it go?" style="position:absolute;left:0;right:0;bottom:0;height:640px;box-sizing:border-box;padding:10px 18px 30px;border-radius:28px 28px 0 0;display:flex;flex-direction:column;gap:14px;background:radial-gradient(ellipse 80% 35% at 100% 0%, {{glow}} 0%, transparent 70%), linear-gradient(180deg,#141A2A 0%,#0C1019 100%);border-top:1px solid rgba(255,255,255,.14);box-shadow:0 -30px 60px -20px rgba(0,0,0,.9)">
<span style="align-self:center;width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)"></span>

<div style="text-align:center">
<div style="font-family:'JetBrains Mono',monospace;font-size:13.5px;color:rgba(255,255,255,.65)">Call ended · 22:16</div>
<div style="margin-top:4px;font-family:'Space Grotesk',sans-serif;font-size:27px;font-weight:700;letter-spacing:-.025em">How did it go?</div>
<div style="margin-top:2px;font-size:14px;color:#9FB0CF">Linda Okafor · Globe Life</div>
</div>

<div role="radiogroup" aria-label="Result" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:5px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09)">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
<span role="radio" aria-checked="{{o.on}}" style="height:56px;border-radius:15px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700;background:{{o.bg}};color:{{o.fg}};box-shadow:{{o.ring}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{o.icon}}"/></svg>{{o.l}}</span>
</sc-for>
</div>

<sc-if value="{{cx}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:14px">
<label style="display:block"><span style="display:block;font-size:13px;font-weight:600;color:#B4C3DE;margin-bottom:6px">Confirmation number <span style="font-weight:500;color:#6F84A8">(optional)</span></span><span style="display:flex;align-items:center;height:52px;box-sizing:border-box;padding:0 14px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.3);font-family:'JetBrains Mono',monospace;font-size:16px">GL-2026-884213</span></label>
<label style="display:block"><span style="display:block;font-size:13px;font-weight:600;color:#B4C3DE;margin-bottom:6px">Takes effect</span><span style="display:flex;align-items:center;justify-content:space-between;height:52px;box-sizing:border-box;padding:0 14px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.14);font-size:15px">Today, Oct 16<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8697B5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span></label>
<div style="display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:16px;background:rgba(127,166,242,.10);border:1px solid rgba(127,166,242,.35);font-size:13.5px;line-height:1.4;color:#C9D4E8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9C2F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>After you save, AI listens to the recording to check Globe Life confirmed the cancel. You get <b style="color:#FFFFFF">$10</b> once it's verified.</span></div>
</div>
</sc-if>

<sc-if value="{{na}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:10px">
<sc-for list="{{naSteps}}" as="n" hint-placeholder-count="2">
<div style="display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09)"><span style="width:30px;height:30px;flex:none;border-radius:10px;background:rgba(163,178,204,.14);color:#C9D4E8;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"/></svg></span><span style="flex:1"><span style="display:block;font-size:14.5px;font-weight:700">{{n.t}}</span><span style="display:block;margin-top:2px;font-size:13px;line-height:1.4;color:#9FB0CF">{{n.s}}</span></span></div>
</sc-for>
</div>
</sc-if>

<div style="flex:1"></div>
<a href="FulToday.dc.html" style="height:54px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;background:#FFFFFF;color:#0D1730;text-decoration:none">Save</a>
<span style="text-align:center;font-size:12.5px;color:#8697B5">Picked the wrong one? You can change it until the end of the day.</span>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"result":{"editor":"enum","options":["Cancelled","No answer"],"default":"Cancelled"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const r = this.props.result ?? 'Cancelled';
const cx = r === 'Cancelled';
const O = (l, icon, c, cfg) => { const on = l === r; return { l, icon, on: on ? 'true' : 'false', bg: on ? c : 'transparent', fg: on ? cfg : '#C9D4E8', ring: on ? '0 10px 24px -12px ' + c : 'none' }; };
const opts = [O('Cancelled', 'M5 12.5l4.5 4.5L19 7.5', '#22C55E', '#04170B'), O('No answer', 'M16 3l5 5M21 3l-5 5M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2', '#A3B2CC', '#0B1220')];
const naSteps = [
{ t: 'Linda gets a text', s: 'With a link to pick a new time that works for her.', icon: 'M4 5h16v11H9l-5 4z' },
{ t: 'No pick? Back on your calendar', s: 'We put her on tomorrow at the same time and text her that morning.', icon: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4' },
];
return { cx, na: !cx, opts, naSteps, glow: cx ? 'rgba(34,197,94,0.22)' : 'rgba(163,178,204,0.16)' };
}
}
</script>
</body>
</html>
