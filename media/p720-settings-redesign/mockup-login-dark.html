<body>
<!-- Prompt 720 reference mockup (static, sample data). Settings rethought. -->


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">

<div style="width: 1440px; height: 900px; display: flex; align-items: flex-start; padding-top: 190px; box-sizing: border-box; justify-content: center; gap: 56px; background: #07080D; background-color: #07080D; background-image: radial-gradient(ellipse 70% 50% at 85% -10%, rgba(75,121,206,0.30) 0%, transparent 70%), radial-gradient(rgba(255,255,255,0.07) 1px, transparent 1px); background-size: auto, 24px 24px; color: #93A6C4; font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
<div style="display: flex; flex-direction: column; gap: 14px"><div style="font-size: 13px; font-weight: 600; color: #8697B5; text-align: center">1. Email and password (no usernames)</div><div style="width: 420px; display: flex; flex-direction: column; gap: 22px; padding: 32px; border-radius: 24px; background: radial-gradient(120% 70% at 0% 0%, rgba(255,255,255,0.045) 0%, transparent 60%), linear-gradient(180deg, #161922 0%, #10121A 100%); border: 1px solid rgba(255,255,255,0.09); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 24px 48px -28px rgba(0,0,0,0.8)"><div style="display: flex; align-items: center; gap: 11px"><span style="width: 34px; height: 34px; border-radius: 10px; background: #0A1F44"></span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; color: #FFFFFF">Ohvara Portal</span></div>
<div><h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; color: #FFFFFF">Sign in</h1><p style="margin: 4px 0 0; font-size: 14px; color: #8697B5">Use the email you joined with.</p></div>
<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13.5px; font-weight: 600; color: #C9D4E8">Email</span><span style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 12px; background: rgba(0,0,0,0.28); border: 1px solid #60A5FA; box-shadow: 0 0 0 4px rgba(59,130,246,0.16); font-size: 15px; color: #FFFFFF; letter-spacing: 0"><span style="display: flex; color: #8697B5"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>nate@ohvara.com</span></label><label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13.5px; font-weight: 600; color: #C9D4E8">Password</span><span style="display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border-radius: 12px; background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.10); font-size: 15px; color: #FFFFFF; letter-spacing: 0.15em"><span style="display: flex; color: #8697B5"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>••••••••••</span></label>
<button style="height: 50px; border: none; border-radius: 999px; background: #60A5FA; color: #0B0D14; font-size: 15px; font-weight: 700">Sign in</button>
<a href="#" style="text-align: center; font-size: 13.5px; font-weight: 600; color: #8697B5">Forgot password?</a></div></div>
<div style="display: flex; flex-direction: column; gap: 14px"><div style="font-size: 13px; font-weight: 600; color: #8697B5; text-align: center">2. Only if two-step is on</div><div style="width: 420px; display: flex; flex-direction: column; gap: 22px; padding: 32px; border-radius: 24px; background: radial-gradient(120% 70% at 0% 0%, rgba(255,255,255,0.045) 0%, transparent 60%), linear-gradient(180deg, #161922 0%, #10121A 100%); border: 1px solid rgba(255,255,255,0.09); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 24px 48px -28px rgba(0,0,0,0.8)"><div style="display: flex; align-items: center; gap: 11px"><span style="width: 34px; height: 34px; border-radius: 10px; background: #0A1F44"></span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; color: #FFFFFF">Ohvara Portal</span></div>
<div style="width: 52px; height: 52px; border-radius: 16px; background: rgba(59,130,246,0.16); color: #60A5FA; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg></div>

<div style="display: flex; gap: 8px"><span style="flex: 1; height: 58px; border-radius: 12px; background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; color: #FFFFFF">7</span><span style="flex: 1; height: 58px; border-radius: 12px; background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; color: #FFFFFF">1</span><span style="flex: 1; height: 58px; border-radius: 12px; background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.10); border-color: #60A5FA; box-shadow: 0 0 0 4px rgba(59,130,246,0.16); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; color: #FFFFFF"></span><span style="flex: 1; height: 58px; border-radius: 12px; background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; color: #FFFFFF"></span><span style="flex: 1; height: 58px; border-radius: 12px; background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; color: #FFFFFF"></span><span style="flex: 1; height: 58px; border-radius: 12px; background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 600; color: #FFFFFF"></span></div>
<button style="height: 50px; border: none; border-radius: 999px; background: #60A5FA; color: #0B0D14; font-size: 15px; font-weight: 700; opacity: 0.5">Verify</button>
<a href="#" style="text-align: center; font-size: 13.5px; font-weight: 600; color: #8697B5">Use a different account</a></div></div>
