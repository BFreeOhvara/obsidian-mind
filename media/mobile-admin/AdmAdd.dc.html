<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin · Add someone (phone sheet)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#FFFFFF;background:#07080D">
<dc-import name="AdmHome" hint-size="390px,844px"></dc-import>
<div style="position:absolute;inset:0;background:rgba(3,5,10,.66)"></div>
<section aria-label="Add someone" style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:10px 18px 30px;border-radius:28px 28px 0 0;display:flex;flex-direction:column;gap:14px;background:radial-gradient(ellipse 80% 35% at 100% 0%, rgba(52,224,196,0.20) 0%, transparent 70%), linear-gradient(180deg,#141A2A 0%,#0C1019 100%);border-top:1px solid rgba(255,255,255,.14);box-shadow:0 -30px 60px -20px rgba(0,0,0,.9);height:600px">
<span style="align-self:center;width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)"></span>
<div style="display:flex;align-items:center;gap:12px"><span style="flex:1;font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:-.02em">Add someone</span><a href="AdmHome.dc.html" aria-label="Close" style="width:40px;height:40px;flex:none;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:#C9D4E8;text-decoration:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a></div>
<div role="radiogroup" aria-label="Role" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:5px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09)">
<sc-for list="{{roles}}" as="o" hint-placeholder-count="2">
<span role="radio" aria-checked="{{o.on}}" style="height:62px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:{{o.bg}};box-shadow:{{o.ring}}"><span style="font-size:15.5px;font-weight:700;color:{{o.fg}}">{{o.l}}</span><span style="font-size:11.5px;color:#8697B5">{{o.s}}</span></span>
</sc-for>
</div>
<label style="display:block"><span style="display:block;font-size:13px;font-weight:600;color:#B4C3DE;margin-bottom:6px">Full name</span><span style="display:flex;align-items:center;height:52px;box-sizing:border-box;padding:0 14px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.3);font-size:16px">Chris Lowe</span></label>
<label style="display:block"><span style="display:block;font-size:13px;font-weight:600;color:#B4C3DE;margin-bottom:6px">Email</span><span style="display:flex;align-items:center;height:52px;box-sizing:border-box;padding:0 14px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.14);font-size:16px;color:#C9D4E8">chris.lowe@gmail.com</span></label>
<div style="display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:16px;background:rgba(127,166,242,.10);border:1px solid rgba(127,166,242,.35);font-size:13.5px;line-height:1.4;color:#C9D4E8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A9C2F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:1px"><path d="M4 6h16v12H4zM4 7l8 6 8-6"/></svg><span>{{note}}</span></div>
<div style="flex:1"></div>
<a href="AdmHome.dc.html" style="height:54px;border-radius:999px;background:#FFFFFF;color:#0D1730;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>Send invite</a>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["Agent","Fulfillment"],"default":"Agent"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const r = this.props.role ?? 'Agent';
const roles = [['Agent', 'Books calls'], ['Fulfillment', 'Makes the calls']].map(([l, s]) => { const on = l === r; return { l, s, on: on ? 'true' : 'false', bg: on ? 'rgba(255,255,255,0.10)' : 'transparent', ring: on ? 'inset 0 0 0 1px rgba(255,255,255,0.18)' : 'none', fg: on ? '#FFFFFF' : '#C9D4E8' }; });
const note = r === 'Agent' ? 'Chris gets an email to set a password, then picks a plan and pays before booking.' : 'Chris gets an email to set a password, then adds a bank to get paid.';
return { roles, note };
}
}
</script>
</body>
</html>
