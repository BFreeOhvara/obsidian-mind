<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin · Needs a listen (phone sheet)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#FFFFFF;background:#07080D">
<dc-import name="AdmPay" hint-size="390px,844px"></dc-import>
<div style="position:absolute;inset:0;background:rgba(3,5,10,.66)"></div>
<section aria-label="Needs a listen" style="position:absolute;left:0;right:0;bottom:0;box-sizing:border-box;padding:10px 18px 30px;border-radius:28px 28px 0 0;display:flex;flex-direction:column;gap:14px;background:radial-gradient(ellipse 80% 35% at 100% 0%, rgba(251,191,36,0.20) 0%, transparent 70%), linear-gradient(180deg,#141A2A 0%,#0C1019 100%);border-top:1px solid rgba(255,255,255,.14);box-shadow:0 -30px 60px -20px rgba(0,0,0,.9);height:640px">
<span style="align-self:center;width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)"></span>
<div style="display:flex;align-items:flex-start;gap:12px">
<span style="flex:1;min-width:0"><span style="display:block;font-size:12.5px;font-weight:700;color:#FCD34D">Needs a listen</span><span style="display:block;margin-top:2px;font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:-.02em">Tom Becker · $10</span><span style="display:block;margin-top:2px;font-size:13px;color:#9FB0CF">GEICO · Test Fulfill · Tue 4:20 PM</span></span>
<a href="AdmPay.dc.html" aria-label="Close" style="width:40px;height:40px;flex:none;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:#C9D4E8;text-decoration:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
</div>
<div style="padding:12px 14px;border-radius:16px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.28);font-size:13.5px;line-height:1.4;color:#E3EAF6">AI couldn’t hear GEICO confirm the cancel. Listen, then decide.</div>

<div style="padding:16px;border-radius:20px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09)">
<div style="display:flex;align-items:center;gap:6px;height:56px">
<sc-for list="{{wave}}" as="b" hint-placeholder-count="40"><span style="flex:1;height:{{b.h}}px;border-radius:2px;background:{{b.c}}"></span></sc-for>
</div>
<div style="margin-top:6px;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:12px;color:#8697B5"><span>4:12</span><span>14:32</span></div>
<div style="margin-top:12px;display:flex;align-items:center;justify-content:center;gap:22px">
<span style="width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#C9D4E8">−15</span>
<span style="width:68px;height:68px;border-radius:50%;background:#FFFFFF;color:#0D1730;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px -10px rgba(255,255,255,.5)"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg></span>
<span style="width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#C9D4E8">+15</span>
</div>
</div>

<div>
<div style="font-size:12.5px;font-weight:600;color:#8697B5;margin-bottom:8px">Jump to</div>
<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{marks}}" as="m" hint-placeholder-count="2">
<span style="display:flex;align-items:center;gap:10px;height:46px;box-sizing:border-box;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);font-size:14px;font-weight:600"><span style="font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#FCD34D;width:44px">{{m.t}}</span>{{m.l}}</span>
</sc-for>
</div>
</div>

<div style="flex:1"></div>
<div style="display:flex;gap:10px">
<a href="AdmPay.dc.html" style="flex:1;height:54px;border-radius:999px;background:#FFFFFF;color:#0D1730;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none">Pay it · $10</a>
<a href="AdmPay.dc.html" style="flex:1;height:54px;box-sizing:border-box;border-radius:999px;border:1px solid rgba(255,255,255,.2);color:#E3EAF6;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;text-decoration:none">Don’t pay</a>
</div>
<span style="text-align:center;font-size:12.5px;color:#8697B5">Test Fulfill sees your choice on their pay page.</span>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const wave = Array.from({ length: 40 }, (_, i) => ({ h: 8 + Math.round(Math.abs(Math.sin(i * 1.7) * 26 + Math.sin(i * 0.6) * 12)), c: i < 12 ? '#FBBF24' : 'rgba(255,255,255,0.22)' }));
const marks = [{ t: '3:05', l: 'GEICO picks up' }, { t: '11:40', l: 'Asked to cancel the policy' }];
return { wave, marks };
}
}
</script>
</body>
</html>
