<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ohvara Overview, phone</title>

</head>
<body>
<!-- Prompt 714 reference mockup (static). Token values are copied from ohvara-dashboard/src/index.css; in the real build use the var(--token) names, never these hexes. -->


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.ov{--bg-base:#0A0A0F;--bg-sidebar:#192C4F;--bg-surface:#13131A;--bg-elevated:#1C1C26;--border:#2A2A3A;--border-strong:#3A3A4C;--text-primary:#FFFFFF;--text-secondary:#93A6C4;--text-muted:#5E7195;--accent:#4B79CE;--accent-deep:#A9C0EE;--warning:#F59E0B;--warning-bd:rgba(245,158,11,0.25);--success:#22C55E;--side-elevated:#153761;--side-text:#FFFFFF;--side-text-2:#93A6C4;--side-text-3:#5E7195;--side-border:rgba(240,240,245,0.9);--glow-a:rgba(75,121,206,0.22);--glow-b:rgba(25,44,79,0.85);--avatar:#F59E0B}
.ov button{font-family:inherit;cursor:pointer}
</style>

<div class="ov" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: var(--bg-base); color: var(--text-secondary); font-family: 'Manrope', system-ui, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased">
<header style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--bg-surface); border-bottom: 1px solid var(--border)">
<button aria-label="Open menu" style="width: 44px; height: 44px; margin-left: -4px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-secondary); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 500; color: var(--text-primary)">Overview</span>
</header>
<main style="flex: 1; box-sizing: border-box; padding: 32px 16px 24px; display: flex; flex-direction: column; gap: 28px; background: radial-gradient(ellipse 90% 45% at 100% 0%, var(--glow-a) 0%, transparent 72%), radial-gradient(ellipse 90% 45% at 0% 100%, var(--glow-b) 0%, transparent 72%)">
<section style="display: flex; flex-direction: column; gap: 20px">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; color: var(--accent-deep)">TUESDAY · OCT 6<span style="margin: 0 8px; color: var(--text-muted)">/</span><span style="color: var(--text-primary)">10:47 PM</span></div>
<div>
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 500; line-height: 1.1; letter-spacing: -0.03em; color: var(--text-primary)">Good evening, Test</h1>
<p style="margin: 8px 0 0; font-size: 15px; color: var(--text-secondary)">Nothing on the books today yet.</p>
</div>
<button style="width: 100%; height: 50px; border: none; border-radius: 999px; background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M12 13v5M9.5 15.5h5"/></svg>Book a call</button>
</section>
<section style="display: flex; flex-direction: column; gap: 12px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<a href="#" style="display: flex; flex-direction: column; justify-content: flex-start; gap: 22px; min-height: 0; box-sizing: border-box; padding: 16px 18px 18px; border-radius: 16px; background: var(--bg-surface); border: 1px solid var(--border)">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 20px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; white-space: nowrap; color: var(--accent-deep)">BOOKED THIS WEEK</span>
</div>
<div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 44px; font-weight: 500; line-height: 1; letter-spacing: -0.04em; color: var(--text-primary); font-variant-numeric: tabular-nums">0</div>
<div style="margin-top: 8px; font-size: 12.5px; line-height: 1.35; color: var(--text-secondary)">since Monday</div>
</div>
</a>

<a href="#" style="display: flex; flex-direction: column; justify-content: flex-start; gap: 22px; min-height: 0; box-sizing: border-box; padding: 16px 18px 18px; border-radius: 16px; background: var(--bg-surface); border: 1px solid var(--border)">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 20px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.08em; white-space: nowrap; color: var(--accent-deep)">CANCELLED THIS WEEK</span>
</div>
<div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 44px; font-weight: 500; line-height: 1; letter-spacing: -0.04em; color: var(--text-primary); font-variant-numeric: tabular-nums">0</div>
<div style="margin-top: 8px; font-size: 12.5px; line-height: 1.35; color: var(--text-secondary)">old policy confirmed cancelled</div>
</div>
</a>
</div>

<div style="display: flex; flex-direction: column; justify-content: space-between; gap: 18px; min-height: 0; box-sizing: border-box; padding: 18px 18px 20px; border-radius: 16px; background: var(--bg-surface); border: 1px solid var(--warning-bd)">
<div style="display: flex; align-items: center; gap: 10px; min-height: 36px">
<span style="width: 8px; height: 8px; border-radius: 50%; background: var(--warning)"></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.14em; color: var(--warning)">NEEDS YOUR ATTENTION</span>
<span style="flex: 1"></span>
<a href="#" style="flex-shrink: 0; height: 44px; padding: 0 18px; box-sizing: border-box; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--bg-elevated); color: var(--text-primary); font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px">Review<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</div>
<div>
<div style="display: flex; align-items: baseline; gap: 14px; min-width: 0">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 52px; font-weight: 500; line-height: 1; letter-spacing: -0.04em; color: var(--warning); font-variant-numeric: tabular-nums">3</div>
<div style="font-size: 17px; font-weight: 600; color: var(--text-primary); line-height: 1.25">clients didn't pick up</div>
</div>
<div style="margin-top: 10px; font-size: 14px; color: var(--text-secondary)">Re-book a time, or Fulfillment will try again.</div>
</div>
</div>


</section>
</main>
</div>


</body>
</html>
