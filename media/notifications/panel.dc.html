<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:420px;height:720px;box-sizing:border-box;display:flex;flex-direction:column;border-radius:22px;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#FFFFFF;background:radial-gradient(120% 40% at 100% 0%, rgba(75,121,206,0.22) 0%, transparent 60%), linear-gradient(180deg,#151B2B 0%,#0E121C 100%);border:1px solid rgba(255,255,255,.13);box-shadow:0 40px 80px -24px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.12)">

<div style="flex:none;padding:18px 18px 14px">
<div style="display:flex;align-items:center;gap:10px">
<span style="font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;letter-spacing:-.015em">Notifications</span>
<span style="min-width:24px;height:22px;padding:0 7px;box-sizing:border-box;border-radius:999px;background:#7FA6F2;color:#0B1220;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center">{{unread}}</span>
<span style="flex:1"></span>
<span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#7FA6F2"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12.5l4.5 4.5L15 8.5M10 16.5l1 .5 9-9"/></svg>Mark all read</span>
</div>
<div style="margin-top:14px;display:flex;padding:3px;gap:3px;border-radius:999px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.09)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><span style="flex:1;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;font-weight:700;background:{{t.bg}};color:{{t.fg}}">{{t.l}}<span style="min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:999px;font-size:11px;font-weight:800;display:{{t.nShow}};align-items:center;justify-content:center;background:{{t.nBg}};color:{{t.nFg}}">{{t.n}}</span></span></sc-for>
</div>
</div>

<sc-if value="{{urgent.show}}" hint-placeholder-val="{{ true }}">
<div style="flex:none;margin:0 14px 10px;padding:14px;border-radius:16px;background:radial-gradient(120% 120% at 100% 0%, rgba(239,68,68,0.30) 0%, transparent 60%), rgba(239,68,68,.08);border:1px solid rgba(248,113,113,.45);display:flex;gap:12px;align-items:flex-start">
<span style="width:36px;height:36px;flex:none;border-radius:11px;background:rgba(239,68,68,.22);color:#FCA5A5;display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{urgent.icon}}"/></svg></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:14px;font-weight:700">{{urgent.title}}</span><span style="display:block;margin-top:2px;font-size:12.5px;line-height:1.4;color:#FECACA">{{urgent.sub}}</span><span style="margin-top:10px;display:inline-flex;align-items:center;height:30px;padding:0 13px;border-radius:999px;background:#FFFFFF;color:#1F0A0A;font-size:12.5px;font-weight:700">{{urgent.btn}}</span></span>
</div>
</sc-if>

<div style="flex:1;min-height:0;overflow:hidden">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
<div>
<div style="padding:10px 18px 6px;font-size:11px;font-weight:700;letter-spacing:.08em;color:#5E7195">{{s.label}}</div>
<sc-for list="{{s.items}}" as="n" hint-placeholder-count="3">
<div style="position:relative;display:flex;align-items:center;gap:12px;height:64px;box-sizing:border-box;padding:0 14px 0 18px;background:{{n.bg}};border-top:1px solid rgba(255,255,255,.05)">
<span style="position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:{{n.c}};display:{{n.bar}}"></span>
<span style="width:36px;height:36px;flex:none;border-radius:11px;background:{{n.tint}};color:{{n.c}};display:flex;align-items:center;justify-content:center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"/></svg></span>
<span style="flex:1;min-width:0">
<span style="display:flex;align-items:baseline;gap:8px"><span style="flex:1;min-width:0;font-size:13.5px;font-weight:{{n.w}};line-height:1.3;color:{{n.tfg}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{n.title}}</span><span style="flex:none;font-family:'JetBrains Mono',monospace;font-size:11px;color:#6F84A8">{{n.time}}</span><span style="flex:none;width:7px;height:7px;border-radius:50%;background:#7FA6F2;align-self:center;display:{{n.dot}}"></span></span>
<span style="display:block;margin-top:3px;font-size:12.5px;line-height:1.3;color:#8697B5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{n.sub}}</span>
</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5E7195" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M9 6l6 6-6 6"/></svg>
</div>
</sc-for>
</div>
</sc-for>
</div>

<div style="flex:none;display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.18);font-size:12.5px">
<span style="display:inline-flex;align-items:center;gap:7px;font-weight:600;color:#C9D4E8"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4"/></svg>Notification settings</span>
<span style="flex:1"></span>
<span style="display:inline-flex;align-items:center;gap:7px;color:#8697B5"><span style="width:7px;height:7px;border-radius:50%;background:{{phone.dot}}"></span>{{phone.t}}</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["Admin","Agent","Fulfillment"],"default":"Admin"},"tab":{"editor":"enum","options":["Needs you","Everything"],"default":"Everything"},"$preview":{"width":420,"height":720}}'>
class Component extends DCLogic {
renderVals() {
const role = this.props.role ?? 'Admin';
const tab = this.props.tab ?? 'Everything';
const I = {
listen: 'M4 15v-3a8 8 0 0 1 16 0v3M4 15h3v5H5a1 1 0 0 1-1-1zM20 15h-3v5h2a1 1 0 0 0 1-1z',
missed: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2M16 3l5 5M21 3l-5 5',
phone: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2',
wallet: 'M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4zM4 7a2 2 0 0 1 2-2h11M16 14h2',
msg: 'M4 5h16v11H9l-5 4z',
join: 'M15 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M8.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M19 8v6M22 11h-6',
win: 'M22 11.1V12a10 10 0 1 1-5.9-9.1M22 4L12 14l-3-3',
cal: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
clock: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',
team: 'M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M21 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8',
flag: 'M5 21V4h11l-2 4 2 4H5',
bolt: 'M13 2L4 14h7l-1 8 9-12h-7z',
gauge: 'M12 14l4-4M3.5 17a9 9 0 1 1 17 0',
};
const C = {
amber: ['#FBBF24', 'rgba(251,191,36,0.15)'], red: ['#F87171', 'rgba(239,68,68,0.16)'], teal: ['#34E0C4', 'rgba(52,224,196,0.14)'],
blue: ['#7FA6F2', 'rgba(127,166,242,0.15)'], purple: ['#C4B5FD', 'rgba(167,139,250,0.16)'], green: ['#4ADE80', 'rgba(34,197,94,0.14)'],
};
const B = (l, primary) => ({ l, bg: primary ? '#FFFFFF' : 'rgba(255,255,255,0.06)', fg: primary ? '#0D1730' : '#E3EAF6', bd: primary ? '#FFFFFF' : 'rgba(255,255,255,0.16)' });
const N = (icon, col, title, sub, time, o = {}) => ({ icon: I[icon], c: C[col][0], tint: C[col][1], title, sub, time, unread: !!o.unread, act: !!o.act, btns: o.btns || [], day: o.day || 'TODAY' });
const D = {
Admin: {
urgent: { show: true, icon: I.wallet, title: 'Monday’s payout is $120 short', sub: 'Stripe has $160 and the run needs $280. Nobody is paid until it’s covered.', btn: 'Open Payouts' },
items: [
N('listen', 'amber', 'Tom Becker needs a listen', 'GEICO · Test Fulfill · AI couldn’t hear the carrier confirm', '4:22 PM', { unread: true, act: true, btns: [B('Listen', true)] }),
N('missed', 'red', 'Nina missed her 2:00 PM call', 'Maria Lopez · rebook text sent, retry tomorrow at 2:00', '2:10 PM', { unread: true, act: true, btns: [B('Open', true), B('Give to…')] }),
N('msg', 'blue', 'Jordan Lee', '“Can you check Maria’s policy again?”', '1:48 PM', { unread: true }),
N('team', 'amber', 'Thursday 2–4 PM is almost full', '2 of 2 reps booked · Nina is off Friday', '11:05 AM', { act: true, btns: [B('See Fulfillment')] }),
N('join', 'green', 'Kai Moreno joined as an Agent', 'Accepted your invite', '9:30 AM'),
N('flag', 'red', 'Test Fulfill hit 3 strikes', '3 missed calls in the last 30 days', 'Thu', { day: 'YESTERDAY', act: true, btns: [B('View rep')] }),
N('bolt', 'red', 'The reminders job failed', '3 runs in a row · details in the 8 AM email', 'Thu', { day: 'YESTERDAY' }),
] },
Agent: {
urgent: { show: true, icon: I.wallet, title: 'Your weekly payment didn’t go through', sub: 'New bookings are paused until it’s fixed. Calls already booked still happen.', btn: 'Update card' },
items: [
N('win', 'teal', 'Policy cancelled for Maria Lopez', 'State Farm · confirmed on the call', '1:42 PM', { unread: true }),
N('missed', 'amber', 'Derek Hall didn’t answer', 'Confirm the number so we can try again', '3:05 PM', { unread: true, act: true, btns: [B('Confirm number', true)] }),
N('phone', 'purple', 'Couldn’t reach Lena Park', 'We tried twice. She’s yours to call and rebook.', '11:40 AM', { act: true, btns: [B('Call Lena', true), B('Rebook')] }),
N('cal', 'blue', 'We missed Omar’s call', 'Rebooking is underway, nothing for you to do', '10:15 AM'),
N('gauge', 'amber', '7 of 7 bookings used', 'Your limit resets Monday', 'Thu', { day: 'YESTERDAY' }),
N('msg', 'blue', 'Brayden', '“Welcome aboard. Ping me with anything.”', 'Thu', { day: 'YESTERDAY' }),
] },
Fulfillment: {
urgent: { show: true, icon: I.wallet, title: 'Connect your bank to get paid', sub: '$130 is waiting for Monday. It’s held until a bank is added.', btn: 'Connect bank' },
items: [
N('phone', 'teal', 'Call Maria Lopez in 5 minutes', '2:00 PM · State Farm · Call client unlocks now', '1:55 PM', { unread: true, act: true, btns: [B('Open call', true)] }),
N('clock', 'red', 'Your 11:00 AM call hasn’t started', 'Priya Shah · 4 minutes past', '11:04 AM', { act: true, btns: [B('Start call', true)] }),
N('cal', 'blue', 'New call booked', 'Thu 2:00 PM · Lena Park · for Sam Ortiz', '12:30 PM', { unread: true }),
N('msg', 'blue', 'Brayden', '“Nice work today.”', '9:12 AM'),
N('flag', 'amber', 'Missed call · strike 1 of 3', 'Omar Reyes, Wed 10:00 AM. Strikes clear after 30 days.', 'Thu', { day: 'YESTERDAY' }),
N('wallet', 'green', 'Paid $230', 'To Chase •••• 4821 · lands in 1–2 days', 'Mon', { day: 'EARLIER' }),
] },
}[role];
const shown = D.items.filter(n => tab === 'Everything' || n.act);
const order = ['TODAY', 'YESTERDAY', 'EARLIER'];
const sections = order.map(label => ({ label, items: shown.filter(n => n.day === label).map(n => Object.assign({}, n, {
bg: n.unread ? 'rgba(127,166,242,0.07)' : 'transparent', bar: n.unread ? 'block' : 'none', dot: n.unread ? 'block' : 'none',
w: n.unread ? 700 : 600, tfg: n.unread ? '#FFFFFF' : '#D5DEEE', btnShow: n.btns.length ? 'flex' : 'none' })) })).filter(s => s.items.length);
const actN = D.items.filter(n => n.act).length;
const tabs = [['Needs you', String(actN)], ['Everything', '']].map(([l, n]) => { const a = l === tab; return { l, n, nShow: n ? 'flex' : 'none', bg: a ? '#FFFFFF' : 'transparent', fg: a ? '#0B0D14' : '#B4C3DE', nBg: a ? '#FBBF24' : 'rgba(251,191,36,0.2)', nFg: a ? '#1A1203' : '#FCD34D' }; });
const unread = String(D.items.filter(n => n.unread).length + 1);
const phone = role === 'Admin' ? { dot: '#4ADE80', t: 'Phone alerts on' } : { dot: '#5E7195', t: 'Phone alerts off · Get the app' };
return { tabs, sections, urgent: D.urgent, unread, phone };
}
}
</script>
</body>
</html>
