<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A client (phone sheet)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#FFFFFF;background:#07080D">
<dc-import name="Clients" hint-size="390px,844px"></dc-import>
<div style="position:absolute;inset:0;background:rgba(3,5,10,.62)"></div>

<section aria-label="Dana Whitfield" style="position:absolute;left:0;right:0;bottom:0;height:680px;box-sizing:border-box;padding:10px 18px 26px;border-radius:28px 28px 0 0;display:flex;flex-direction:column;background:radial-gradient(ellipse 80% 35% at 100% 0%, rgba(75,121,206,0.28) 0%, transparent 70%), linear-gradient(180deg,#141A2A 0%,#0C1019 100%);border-top:1px solid rgba(255,255,255,.14);box-shadow:0 -30px 60px -20px rgba(0,0,0,.9)">
<span style="align-self:center;width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)"></span>

<div style="margin-top:14px;display:flex;align-items:center;gap:12px">
<span style="width:52px;height:52px;flex:none;border-radius:50%;background:rgba(127,166,242,.18);color:#A9C2F5;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center">DW</span>
<span style="flex:1;min-width:0"><span style="display:block;font-family:'Space Grotesk',sans-serif;font-size:23px;font-weight:700;letter-spacing:-.02em">Dana Whitfield</span><span style="margin-top:4px;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:rgba(127,166,242,.15);color:#A9C2F5;font-size:12px;font-weight:700"><span style="width:6px;height:6px;border-radius:50%;background:#7FA6F2"></span>Booked · waiting for Fulfillment</span></span>
<a href="Clients.dc.html" aria-label="Close" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:#C9D4E8;text-decoration:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
</div>

<div style="margin-top:16px;display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:linear-gradient(135deg, rgba(75,121,206,0.35) 0%, rgba(13,23,48,0.9) 100%);border:1px solid rgba(127,166,242,.45)">
<span style="width:50px;height:54px;flex:none;border-radius:14px;background:rgba(255,255,255,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1"><small style="font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#A9C2F5">FRI</small><b style="margin-top:4px;font-family:'Space Grotesk',sans-serif;font-size:21px">16</b></span>
<span style="flex:1"><span style="display:block;font-size:12.5px;color:#B4C3DE">Fulfillment calls Dana</span><span style="display:block;font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700">Today, 2:00 PM</span><span style="display:block;font-size:12.5px;color:#9FB0CF">in 1 h 20 m · her time (Central)</span></span>
</div>

<div style="margin-top:14px;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08)">
<sc-for list="{{info}}" as="i" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:12px;height:54px;padding:0 14px;border-top:{{i.rule}}">
<span style="width:20px;color:#8697B5;display:flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"/></svg></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:11.5px;color:#6F84A8">{{i.k}}</span><span style="display:block;font-size:14.5px;font-weight:600">{{i.v}}</span></span>
<a href="#" style="display:{{i.ashow}};height:34px;padding:0 13px;border-radius:999px;background:rgba(52,224,196,.14);border:1px solid rgba(52,224,196,.4);color:#5EEAD4;font-size:13px;font-weight:700;align-items:center;gap:6px;text-decoration:none">{{i.a}}</a>
</div>
</sc-for>
</div>

<div style="margin-top:16px;font-size:12px;font-weight:700;letter-spacing:.06em;color:#5E7195">HISTORY</div>
<div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">
<sc-for list="{{history}}" as="h" hint-placeholder-count="3">
<div style="display:flex;gap:12px;align-items:flex-start"><span style="width:9px;height:9px;margin-top:5px;flex:none;border-radius:50%;background:{{h.c}};box-shadow:0 0 0 4px {{h.halo}}"></span><span style="flex:1;font-size:13.5px;color:#C9D4E8">{{h.t}}</span><span style="font-family:'JetBrains Mono',monospace;font-size:11.5px;color:#6F84A8">{{h.when}}</span></div>
</sc-for>
</div>

<div style="flex:1"></div>
<div style="display:flex;gap:10px">
<a href="Book.dc.html" style="flex:1;height:52px;border-radius:999px;background:#FFFFFF;color:#0D1730;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg>Change booking</a>
<a href="#" aria-label="Message Fulfillment" style="width:52px;height:52px;box-sizing:border-box;border-radius:50%;border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#E3EAF6;text-decoration:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const R = '1px solid rgba(255,255,255,0.07)';
const info = [
{ k: 'Phone', v: '(602) 555-0184', icon: 'M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2', a: 'Call', ashow: 'inline-flex', rule: 'none' },
{ k: 'Lives in', v: 'Pensacola, Florida', icon: 'M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12zM12 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4z', a: '', ashow: 'none', rule: R },
{ k: 'Carrier she’s leaving', v: 'Aetna', icon: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z', a: '', ashow: 'none', rule: R },
];
const history = [
{ t: 'Booked by you for today, 2:00 PM', when: 'Wed', c: '#7FA6F2', halo: 'rgba(127,166,242,0.18)' },
{ t: 'Assigned to Fulfillment', when: 'Wed', c: '#34E0C4', halo: 'rgba(52,224,196,0.16)' },
];
return { info, history };
}
}
</script>
</body>
</html>
