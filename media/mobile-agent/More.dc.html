<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>More (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#FFFFFF;background-color:#07080D;background-image:radial-gradient(ellipse 90% 40% at 90% -5%, rgba(75,121,206,0.32) 0%, transparent 70%),radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);background-size:auto,22px 22px">

<div style="padding:18px 16px 110px;display:flex;flex-direction:column;gap:14px">
<h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;letter-spacing:-.03em">More</h1>

<section style="display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:radial-gradient(ellipse 70% 110% at 100% 0%, rgba(52,224,196,0.26) 0%, transparent 65%), linear-gradient(135deg, #16294C 0%, #0D1730 100%);border:1px solid rgba(255,255,255,.12)">
<span style="width:54px;height:54px;flex:none;border-radius:50%;background:#F59E0B;color:#1A1203;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(255,255,255,.16)">TA</span>
<span style="flex:1;min-width:0"><span style="display:block;font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700">Test Agent</span><span style="display:block;font-size:13px;color:#B4C3DE">Agent · Premium plan</span></span>
</section>

<section style="padding:16px;border-radius:22px;background:linear-gradient(180deg,#151A26 0%,#10131C 100%);border:1px solid rgba(255,255,255,.09)">
<div style="display:flex;align-items:baseline;justify-content:space-between"><span style="font-size:13px;font-weight:600;color:#8697B5">Billing</span><span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#4ADE80"><span style="width:6px;height:6px;border-radius:50%;background:#4ADE80"></span>Paid up</span></div>
<div style="margin-top:6px;display:flex;align-items:baseline;gap:8px"><span style="font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;letter-spacing:-.03em">$500</span><span style="font-size:13.5px;color:#9FB0CF">a week · next charge Mon, Oct 19</span></div>
<div style="margin-top:12px;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden"><span style="display:block;width:25%;height:100%;border-radius:4px;background:linear-gradient(90deg,#34E0C4,#4B79CE)"></span></div>
<div style="margin-top:6px;display:flex;justify-content:space-between;font-size:12.5px;color:#9FB0CF"><span>4 of 16 bookings used</span><span>Resets Monday</span></div>
<a href="#" style="margin-top:14px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#E3EAF6;text-decoration:none">Manage billing</a>
</section>

<section style="border-radius:22px;overflow:hidden;background:linear-gradient(180deg,#151A26 0%,#10131C 100%);border:1px solid rgba(255,255,255,.09)">
<sc-for list="{{items}}" as="i" hint-placeholder-count="6">
<a href="#" style="display:flex;align-items:center;gap:14px;height:56px;padding:0 16px;border-top:{{i.rule}};text-decoration:none;color:{{i.fg}}">
<span style="width:34px;height:34px;flex:none;border-radius:11px;background:{{i.tint}};color:{{i.c}};display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.icon}}"/></svg></span>
<span style="flex:1;font-size:15px;font-weight:600">{{i.l}}</span>
<span style="font-size:13px;color:#8697B5">{{i.right}}</span>
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5E7195" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:{{i.chev}}"><path d="M9 6l6 6-6 6"/></svg>
</a>
</sc-for>
</section>

<a href="#" style="height:52px;border-radius:18px;background:rgba(239,68,68,.08);border:1px solid rgba(248,113,113,.3);display:flex;align-items:center;justify-content:center;gap:9px;font-size:15px;font-weight:700;color:#FCA5A5;text-decoration:none"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 16l4-4-4-4M14 12H4"/></svg>Sign out</a>
</div>

<nav aria-label="Main" style="position:absolute;left:0;right:0;bottom:0;height:86px;box-sizing:border-box;padding:8px 10px 22px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;background:rgba(10,13,22,.94);border-top:1px solid rgba(255,255,255,.09);box-shadow:0 -20px 40px -20px rgba(0,0,0,.9)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" aria-label="{{t.l}}" style="display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:{{t.fg}};font-size:11px;font-weight:{{t.w}}">
<span style="width:{{t.size}}px;height:{{t.size}}px;margin-top:{{t.mt}}px;border-radius:{{t.r}};display:flex;align-items:center;justify-content:center;background:{{t.bg}};color:{{t.ic}};box-shadow:{{t.glow}}"><svg width="{{t.isz}}" height="{{t.isz}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{t.sw}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg></span>
<span style="display:{{t.lshow}}">{{t.l}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
