<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clients (phone)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#FFFFFF;background-color:#07080D;background-image:radial-gradient(ellipse 90% 40% at 90% -5%, rgba(75,121,206,0.32) 0%, transparent 70%),radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);background-size:auto,22px 22px">

<div style="padding:18px 16px 0">
<div style="display:flex;align-items:baseline;gap:10px"><h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;letter-spacing:-.03em">Clients</h1><span style="font-size:14px;color:#8697B5">25 · 6 cancelled</span></div>
<label style="margin-top:14px;display:flex;align-items:center;gap:10px;height:48px;box-sizing:border-box;padding:0 14px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:#8697B5;font-size:15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input type="search" placeholder="Name, phone, city or carrier" aria-label="Search clients" style="flex:1;min-width:0;border:none;outline:none;background:transparent;color:#FFFFFF;font:inherit"></label>
<div role="group" aria-label="Filter by status" style="margin-top:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:5px;gap:4px;border-radius:20px;background:linear-gradient(180deg,#151A26 0%,#10131C 100%);border:1px solid rgba(255,255,255,.09)">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
<button type="button" aria-pressed="{{s.pressed}}" style="position:relative;height:70px;border:none;border-radius:15px;background:{{s.bg}};font-family:inherit;color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:{{s.ring}}"><span style="font-size:13px;font-weight:700;color:{{s.c}};white-space:nowrap">{{s.l}}</span><span style="font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:600;line-height:1;color:{{s.lfg}}">{{s.n}}</span><span style="position:absolute;bottom:7px;width:18px;height:3px;border-radius:2px;background:{{s.c}};opacity:{{s.bar}}"></span></button>
</sc-for>
</div>
</div>

<div style="margin-top:14px;padding:0 16px 110px;display:flex;flex-direction:column;gap:16px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<section>
<div style="display:flex;align-items:center;gap:8px;padding:0 4px 8px;font-size:12px;font-weight:700;letter-spacing:.06em;color:{{g.fg}}"><span style="width:7px;height:7px;border-radius:50%;background:{{g.fg}}"></span>{{g.label}}</div>
<div style="border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#151A26 0%,#10131C 100%);border:1px solid rgba(255,255,255,.09)">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<a href="Client.dc.html" style="display:flex;align-items:center;gap:12px;height:68px;padding:0 14px;border-top:{{r.rule}};text-decoration:none;color:#FFFFFF">
<span style="width:40px;height:40px;flex:none;border-radius:50%;background:rgba(127,166,242,.16);color:#A9C2F5;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center">{{r.ini}}</span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.name}}</span><span style="display:block;margin-top:2px;font-size:12.5px;color:#8697B5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.sub}}</span></span>
<span style="text-align:right;flex:none"><span style="display:block;font-size:13.5px;font-weight:700;color:{{r.rfg}}">{{r.right}}</span><span style="display:block;margin-top:2px;font-size:11.5px;color:#6F84A8">{{r.right2}}</span></span>
</a>
</sc-for>
</div>
</section>
</sc-for>
</div>

<nav aria-label="Main" style="position:absolute;left:0;right:0;bottom:0;height:86px;box-sizing:border-box;padding:8px 10px 22px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;background:rgba(10,13,22,.94);border-top:1px solid rgba(255,255,255,.09);box-shadow:0 -20px 40px -20px rgba(0,0,0,.9)">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
<a href="{{t.href}}" aria-label="{{t.l}}" style="display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:{{t.fg}};font-size:11px;font-weight:{{t.w}}">
<span style="width:{{t.size}}px;height:{{t.size}}px;margin-top:{{t.mt}}px;border-radius:{{t.r}};display:flex;align-items:center;justify-content:center;background:{{t.bg}};color:{{t.ic}};box-shadow:{{t.glow}}"><svg width="{{t.isz}}" height="{{t.isz}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{t.sw}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"/></svg></span>
<span style="display:{{t.lshow}}">{{t.l}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"filter":{"editor":"enum","options":["None","Needs you","Booked","No answer","Cancelled"],"default":"None"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const TABS = [
['Home', 'Main.dc.html', 'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z'],
['Clients', 'Clients.dc.html', 'M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M21 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8'],
['Book a call', 'Book.dc.html', 'M12 5v14M5 12h14'],
['Messages', '#', 'M4 5h16v11H9l-5 4z'],
['More', 'More.dc.html', 'M4 6h16M4 12h16M4 18h10'],
];
const active = 'Clients';
const tabs = TABS.map(([l, href, icon]) => {
const book = l === 'Book a call', on = l === active;
return book
? { l, href, icon, size: 56, mt: -26, r: '50%', bg: 'linear-gradient(135deg,#34E0C4 0%,#4B79CE 100%)', ic: '#FFFFFF', glow: '0 12px 28px -8px rgba(52,224,196,.8), 0 0 0 5px #0A0D16', isz: 26, sw: 2.6, lshow: 'none', fg: '#FFFFFF', w: 700 }
: { l, href, icon, size: 30, mt: 0, r: '10px', bg: 'transparent', ic: on ? '#7FA6F2' : '#8697B5', glow: 'none', isz: 22, sw: on ? 2.2 : 1.9, lshow: 'block', fg: on ? '#FFFFFF' : '#8697B5', w: on ? 700 : 600 };
});
const picked = this.props.filter ?? 'None';
const stats = [['Needs you', '3', '#FCD34D'], ['Booked', '14', '#A9C2F5'], ['No answer', '2', '#C9D4E8'], ['Cancelled', '6', '#5EEAD4']].map(([l, n, c]) => { const on = l === picked; return { l, n, c, pressed: on ? 'true' : 'false', bg: on ? 'rgba(255,255,255,0.09)' : 'transparent', ring: on ? 'inset 0 0 0 1px rgba(255,255,255,0.14)' : 'none', lfg: on ? '#FFFFFF' : '#C9D4E8', bar: on ? 1 : 0 }; });
const R = '1px solid rgba(255,255,255,0.07)';
const row = (name, sub, right, right2, rfg, i) => ({ name, sub, right, right2, rfg, ini: name.split(' ').map(x => x[0]).join(''), rule: i ? R : 'none' });
const groups = [
{ label: 'NEEDS YOU', fg: '#FBBF24', rows: [row('Derek Hall', 'Allstate · Tulsa, OK', 'Confirm number', 'No answer', '#FCD34D', 0), row('Lena Park', 'State Farm · Austin, TX', 'Call her', 'Couldn’t reach', '#C4B5FD', 1), row('Maria Lopez', 'Chubb · San Antonio, TX', 'Stuck 3 days', 'Needs attention', '#FCD34D', 2)] },
{ label: 'BOOKED · NEXT UP', fg: '#7FA6F2', rows: [row('Dana Whitfield', 'Aetna · Pensacola, FL', 'Today 2:00 PM', 'in 1 h 20 m', '#A9C2F5', 0), row('Marcus Reyes', 'Mutual of Omaha · Tucson, AZ', 'Mon 10:00 AM', 'Oct 19', '#FFFFFF', 1), row('Lorraine Pruitt', 'Transamerica · Evansville, IN', 'Tue 1:30 PM', 'Oct 20', '#FFFFFF', 2)] },
];
return { tabs, stats, groups };
}
}
</script>
</body>
</html>
