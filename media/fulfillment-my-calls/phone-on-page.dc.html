<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My calls with the phone open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:1440px;height:1080px;overflow:hidden">
<dc-import name="Desk" mode="On a call" hint-size="1440px,1080px"></dc-import>
<div style="position:absolute;right:28px;bottom:28px">
<dc-import name="Phone" stage="On hold with carrier" hint-size="360px,640px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
